[project]
name = "codebot"
version = "0.1.0"
description = "Personal CLI coding agent on Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.5",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
codebot = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
